; PlatformIO Project Configuration File - Mini Deck IoT (Fase 3: LVGL + Serial JSON)
; Hardware: Guition JC3248W535C
;   MCU     : ESP32-S3-WROOM-1-N16R8 (16MB QIO Flash, 8MB OPI PSRAM, USB-Serial/JTAG)
;   Display : 3.5" 320x480 IPS QSPI - Driver AXS15231B (modo paisagem 480x320 via Canvas)
;   Touch   : Capacitivo integrado AXS15231B via I2C (SDA=GPIO4, SCL=GPIO8, Addr=0x3B)

[env:jc3248w535c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Memória do ESP32-S3-N16R8 (16MB Quad Flash + 8MB Octal PSRAM)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; Serial e Upload (USB-Serial/JTAG nativo do ESP32-S3 em COM8)
upload_port = COM8
monitor_port = COM8
monitor_speed = 115200
upload_speed = 921600
monitor_dtr = 0
monitor_rts = 0

; Diretivas de compilação (USB CDC nativo, PSRAM, LVGL config e pinagem JC3248W535C)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -DGFX_BL=1
    -DQSPI_CS=45
    -DQSPI_SCLK=47
    -DQSPI_D0=21
    -DQSPI_D1=48
    -DQSPI_D2=40
    -DQSPI_D3=39
    -DTOUCH_SDA=4
    -DTOUCH_SCL=8
    -DTOUCH_INT=3
    -DTOUCH_ADDR=0x3B
    -DDISPLAY_ROTATION=1

; Bibliotecas (Arduino_GFX 1.5.5 para Arduino-ESP32 2.x, LVGL 8.3.11, ArduinoJson 7, WebSockets)
lib_deps =
    moononournation/GFX Library for Arduino @ 1.5.5
    lvgl/lvgl @ ~8.3.11
    bblanchon/ArduinoJson @ ^7.3.0
    links2004/WebSockets @ ^2.4.1
